{% load static %}<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | Sabor & Cia</title><link rel="stylesheet" href="{% static 'app.css' %}"></head><body class="login"><article class="panel"><a class="brand" href="/">sabor<span>&cia.</span></a><p class="eyebrow">DA COZINHA AO CLIENTE</p><h1>Tudo no seu lugar.</h1><p>Entre para atender, acompanhar pedidos e cuidar do cardápio.</p>{% if form.errors %}<p role="alert" class="error">Usuário ou senha incorretos.</p>{% endif %}<form method="post">{% csrf_token %}<label>Usuário<input name="username" autocomplete="username" required autofocus></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><input type="hidden" name="next" value="{{ next }}"><button class="primary full">Entrar</button></form></article></body></html>
