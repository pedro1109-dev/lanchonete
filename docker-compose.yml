services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Execute configurar.py primeiro}
      POSTGRES_USER: ${POSTGRES_USER:?Execute configurar.py primeiro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute configurar.py primeiro}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [interna]
  backend:
    build: ./sistema
    env_file: .env
    environment:
      DB_HOST: db
      USE_SQLITE: "0"
    volumes:
      - arquivos_estaticos:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [interna]
  frontend:
    image: nginx:1.28-alpine
    volumes:
      - ./sistema/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - arquivos_estaticos:/static:ro
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [interna]
volumes:
  dados_postgres:
  arquivos_estaticos:
networks:
  interna:
